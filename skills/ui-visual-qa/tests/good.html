<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="shared.css">
<style>
  html { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; scrollbar-gutter: stable; scroll-padding-bottom: 96px; }
  body { word-break: keep-all; overflow-wrap: break-word; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .x { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; padding:0; border:0; background:var(--surface); color:var(--icon); flex:none; }
  .faint { color:var(--muted); font-size:13px; }
  .row { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
  @media (min-width: 600px) { .row { grid-template-columns:repeat(6, minmax(0, 1fr)); } }
  .row button { height:44px; padding:0 4px; border:1px solid var(--border); background:var(--surface); color:var(--text); white-space:nowrap; min-width:0; }
  .narrow { width:110px; }
  .narrow button { width:100%; min-height:44px; white-space:nowrap; }
  .desc { width:150px; color:var(--muted); text-wrap: pretty; }
  .box { height:120px; overflow:auto; border:1px solid var(--border); scrollbar-width:thin; scrollbar-color:var(--thumb) transparent; overscroll-behavior:contain; }
  .menu-host { display:flex; justify-content:flex-end; position:relative; }
  .menu { position:absolute; top:48px; right:0; width:min(220px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--border); }
  .menu[hidden] { display:none; }
  .menu button { display:block; width:100%; height:44px; border:0; background:none; color:var(--text); text-align:left; padding:0 12px; }
  .tool { display:flex; gap:8px; }
  .tool button { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border:0; background:var(--surface); color:var(--icon); }
  .ov { display:flex; gap:8px; }
  .ov button { height:44px; padding:0 12px; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding-bottom:max(34px, env(safe-area-inset-bottom)); display:flex; justify-content:space-around; align-items:center; background:var(--surface); }
  .bar button { width:44px; height:44px; border:0; background:none; color:var(--icon); display:inline-flex; align-items:center; justify-content:center; }
  .pill { display:inline-flex; align-items:center; height:44px; padding:0 12px; border:0; background:rgba(237,36,43,.11); color:#b4232a; }
  :root[data-theme="dark"] .pill { color:#ff8585; }
  .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0, 0, 0, 0); white-space:nowrap; border:0; }
  .chan { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 8px; border:0; background:none; color:var(--text); font-size:13px; line-height:1.5; }
  .card { padding:12px; background:var(--surface); display:flex; justify-content:space-between; align-items:center; gap:8px; }
</style></head>
<body>
<div class="head"><h1>영상 설정</h1>
  <button class="x" aria-label="닫기"><svg class="lucide lucide-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>

<section><p class="faint">작은 설명 문구</p>
  <button class="x" aria-label="더보기"><svg class="lucide lucide-ellipsis" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></section>

<section class="narrow"><button>모두 저장</button></section>
<section><p class="desc">구독한 채널의 새 영상을 자동으로 보관합니다</p></section>

<section class="row"><button>전체</button><button>오늘</button><button>보관함</button><button>읽음</button><button>폴더</button><button>태그</button></section>

<section class="tool">
  <button aria-label="보관"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button>
  <button aria-label="복사"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
  <button aria-label="공유"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg></button>
  <button aria-label="닫기"><svg class="lucide lucide-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</section>

<section class="menu-host"><button class="x" id="more" aria-label="더보기" aria-haspopup="menu" onclick="m.hidden=!m.hidden"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  <div class="menu" id="m" role="menu" hidden><button role="menuitem">이름 바꾸기</button><button role="menuitem">삭제</button></div></section>

<section><button class="pill" aria-current="page">홈 (반투명 배경)</button></section>
<section><button class="chan"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="sr">채널: </span><span>당근 팀</span></button></section>
<section class="ov"><button>이전</button><button>다음</button></section>
<section class="box"><p>긴 목록</p><p>1</p><p>2</p><p>3</p><p>4</p><p>5</p><p>6</p></section>
<section><div class="card" data-gesture="longpress" data-gesture-alt="#card-more">길게 눌러 메뉴 열기
  <button class="x" id="card-more" aria-label="카드 메뉴" aria-haspopup="menu"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></div></section>
<p role="status" aria-live="polite"></p>
<nav class="bar" aria-label="하단 메뉴"><button aria-label="홈"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11H3z"/></svg></button><button aria-label="설정"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/></svg></button></nav>
</body></html>
